name: 功能建议 / Feature request
description: 新增平台、字段、部署形态或页面能力
title: "[Feat] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        功能建议不需要写完整方案，说清「在什么场景下卡住了」比直接给实现更有用。
        涉及响应字段变更的，请说明是否会破坏统一 JSON 3.0 契约。

  - type: checkboxes
    attributes:
      label: 提交前自查
      options:
        - label: 这确实是一个新能力，不是现有接口的使用问题
          required: true
        - label: 已确认 README 与 docs/ 里没有相关说明
          required: false
  - type: dropdown
    id: kind
    attributes:
      label: 建议类型
      options:
        - 新增平台支持
        - 新增 / 调整响应字段
        - 网页解析页面能力
        - 部署形态（Docker / Workers / CLI）
        - 文档与示例
        - 其他
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述实际遇到的困难，而不是先给方案。有具体平台链接时请贴一条公开示例。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 有接口设计或多平台字段对照时请一并给出，方便判断是否要扩展统一 JSON 契约。
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
    validations:
      required: false
  - type: checkboxes
    id: contribute
    attributes:
      label: 参与意愿
      options:
        - label: 我愿意提交 PR 实现这个功能
        - label: 我可以提供该平台的测试链接与返回样本
