name: 文档链接检查

on:
  pull_request:
    paths:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    name: Markdown 相对链接
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 检查相对路径链接是否指向真实文件
        run: bash .github/scripts/check-links.sh
